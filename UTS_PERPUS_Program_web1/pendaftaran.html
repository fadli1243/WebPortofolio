          <li><a href="pendaftaran.html" class="aktif">Pendaftaran</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <h1>Pendaftaran Pelatihan Karier Mahasiswa</h1>

    <section class="kartu">
      <form action="#" method="post">
        <div class="grup">
          <label class="judul" for="nama">Nama Lengkap</label>
          <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
        </div>

        <div class="grup">
          <label class="judul" for="nim">NIM</label>
          <input type="text" id="nim" name="nim" placeholder="Masukkan NIM" required>
        </div>

        <div class="grup">
          <label class="judul" for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="nama@kampus.ac.id" required>
        </div>

        <div class="grup">
          <span>Jenis Kelamin</span>
          <div class="radio-group">
            <label><input type="radio" name="jk" value="Laki-laki" required> Laki-laki</label>
            <label><input type="radio" name="jk" value="Perempuan"> Perempuan</label>
          </div>
        </div>

        <div class="grup">
          <label class="judul" for="pelatihan">Pilihan Pelatihan</label>
          <select id="pelatihan" name="pelatihan" required>
            <option value="">-- Pilih Pelatihan --</option>
            <option>Persiapan Karier dan Dunia Kerja</option>
            <option>Penyusunan CV dan Surat Lamaran</option>
            <option>Simulasi Wawancara Kerja</option>
            <option>Pengembangan Soft Skill</option>
          </select>
        </div>

        <div class="grup">
          <label class="judul" for="semester">Semester</label>
          <select id="semester" name="semester" required>
            <option value="">-- Pilih Semester --</option>
            <option>1</option><option>2</option><option>3</option><option>4</option>
            <option>5</option><option>6</option><option>7</option><option>8</option>
          </select>
        </div>

        <div class="grup">
          <label class="judul" for="alasan">Alasan Mengikuti</label>
          <textarea id="alasan" name="alasan" rows="5" placeholder="Tuliskan alasan Anda mengikuti pelatihan ini" required></textarea>
        </div>

        <button type="submit">Daftar</button>
      </form>
    </section>
  </main>
